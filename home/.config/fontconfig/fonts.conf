<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Reject FreeSans: Its broken Indic/Malayalam OpenType tables cause conjuncts/ligatures to break into separate letters with virama -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>FreeSans</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- Default font preferences with Malayalam fallback -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter</string>
      <string>Noto Sans</string>
      <string>Noto Sans Malayalam</string>
      <string>RIT Meera New</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>RIT Rachana</string>
      <string>RIT Meera New</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>Adwaita Mono</string>
      <string>Noto Sans Malayalam</string>
      <string>RIT Meera New</string>
    </edit>
  </match>

  <!-- Aliases for standard compatibility -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Sans Malayalam</family>
      <family>RIT Meera New</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>RIT Rachana</family>
      <family>RIT Meera New</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Adwaita Mono</family>
      <family>Noto Sans Malayalam</family>
      <family>RIT Meera New</family>
    </prefer>
  </alias>
</fontconfig>
