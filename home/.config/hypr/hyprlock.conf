# ═══════════════════════════════════════════════════════════════════
#  Noctalia Glassmorphic Hyprlock Rice
#  Auto-theming via Noctalia Matugen Template System
#  Featuring Live Battery, WiFi Status, Uptime & Frosted Glass Hub
# ═══════════════════════════════════════════════════════════════════

# ── BACKGROUND ──────────────────────────────────────────────────
background {
    monitor =
    path = /home/ldzbeta/Pictures/Wallpapers/Dolomites-by-Wirestock.jpg
    blur_passes = 3
    blur_size = 4
    contrast = 0.8916
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.0
    color = rgba(141c2bFF)
}

# ── GENERAL CONFIG ──────────────────────────────────────────────
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    ignore_empty_input = false
    text_trim = true
}

# ── TOP-RIGHT STATUS BAR: GLASS PILL ─────────────────────────────
shape {
    monitor =
    size = 230, 42
    rounding = 21
    color = rgba(22304499)
    border_size = 1
    border_color = rgba(d9d9d955)
    position = -40, -35
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000044)
}

# WiFi Indicator (Inside Top-Right Pill)
label {
    monitor =
    text = cmd[update:10000] /home/ldzbeta/.config/hypr/scripts/hyprlock-network.sh
    color = rgba(0a84ffEE)
    font_size = 12
    font_family = JetBrainsMono Nerd Font SemiBold
    position = -145, -46
    halign = right
    valign = top
}

# Battery Indicator (Inside Top-Right Pill)
label {
    monitor =
    text = cmd[update:5000] /home/ldzbeta/.config/hypr/scripts/hyprlock-battery.sh
    color = rgba(f5f5f7EE)
    font_size = 12
    font_family = JetBrainsMono Nerd Font SemiBold
    position = -55, -46
    halign = right
    valign = top
}

# ── TOP-LEFT STATUS BAR: UPTIME GLASS PILL ───────────────────────
shape {
    monitor =
    size = 160, 42
    rounding = 21
    color = rgba(22304499)
    border_size = 1
    border_color = rgba(d9d9d955)
    position = 40, -35
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000044)
}

label {
    monitor =
    text = cmd[update:60000] /home/ldzbeta/.config/hypr/scripts/hyprlock-uptime.sh
    color = rgba(f5f5f7DD)
    font_size = 12
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 58, -46
    halign = left
    valign = top
}

# ── HERO CLOCK & DATE ───────────────────────────────────────────
# Hour : Minute
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(0a84ffFF)
    font_size = 96
    font_family = Montserrat ExtraBold
    position = 0, 275
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(00000055)
}

# Date Label
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(f5f5f7EE)
    font_size = 18
    font_family = Montserrat SemiBold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000044)
}

# ── CENTER AUTHENTICATION HUB (FROSTED GLASS CARD) ──────────────
# Main Acrylic Card
shape {
    monitor =
    size = 360, 310
    rounding = 26
    color = rgba(16203088)
    border_size = 1
    border_color = rgba(d9d9d955)
    rotate = 0
    xray = false
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 16
    shadow_color = rgba(00000066)
}

# User Avatar
image {
    monitor =
    path = ~/.face
    size = 100
    rounding = -1
    border_size = 3
    border_color = rgba(0a84ffDD)
    rotate = 0
    reload_time = -1
    position = 0, 35
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000044)
}

# User Name
label {
    monitor =
    text = $USER
    color = rgba(f5f5f7EE)
    font_size = 18
    font_family = Montserrat Bold
    position = 0, -35
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(0a84ff66)
    inner_color = rgba(30435f99)
    font_color = rgba(f5f5f7FF)
    fade_on_empty = false
    font_family = Montserrat
    placeholder_text = <i><span foreground="##d0d5dd99">󰌾  Enter password...</span></i>
    hide_input = false
    rounding = 16
    check_color = rgba(0a84ffFF)
    fail_color = rgba(ff453aFF)
    fail_text = <i><span foreground="##ff453aFF">󰌑  $PAMFAIL</span></i>
    capslock_color = rgba(5ac8faFF)
    position = 0, -115
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000033)
}

# ── BOTTOM SYSTEM BAR: STATUS & POWER HINT ───────────────────────
label {
    monitor =
    text = 󰌌  $LAYOUT  •  󰐥  Press Power to Sleep  •  Press Enter to Unlock
    color = rgba(d0d5dd88)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = bottom
}
