source = ~/.config/hypr/noctalia/noctalia-colors.conf
source = ~/.config/hypr/configs/keybinds.conf
source = ~/.config/hypr/configs/base.conf
source = ~/.config/hypr/configs/autostart.conf
source = ~/.config/hypr/configs/env.conf
source = ~/.config/hypr/configs/animations.conf
source = ~/.config/hypr/configs/decorations.conf
source = ~/.config/hypr/configs/windowrules.conf
source = ~/.config/hypr/noctalia/noctalia-overrides.conf
source = ~/.config/hypr/configs/plugins.conf

# nwg stuff, don't edit directly
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# uncomment this to enable smart gaps and borders
# source = ~/.config/hypr/configs/smart-gaps-borders.conf

# Uncomment this if you are using nvidia
source = ~/.config/hypr/configs/nvidia-fix.conf

# User overrides config
source = ~/.config/hypr/configs/user-overrides.conf

# Display Mode Switcher (hypr-display)
bind = SUPER, F7, exec, /home/ldzbeta/.local/bin/hypr-display gui
# Quick mode shortcuts
bind = SUPER SHIFT, F5, exec, /home/ldzbeta/.local/bin/hypr-display laptop
bind = SUPER SHIFT, F6, exec, /home/ldzbeta/.local/bin/hypr-display extend
bind = SUPER SHIFT, F7, exec, /home/ldzbeta/.local/bin/hypr-display mirror
bind = SUPER SHIFT, F8, exec, /home/ldzbeta/.local/bin/hypr-display hdmi
