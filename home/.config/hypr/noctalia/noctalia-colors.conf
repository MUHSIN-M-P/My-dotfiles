# ── Dark Purple Glassy Theme (Darkly-inspired) ──
# Primary accent: purple/violet glow
$primary         = rgb(a855f7)    # vivid purple (active border, highlights)
$secondary       = rgb(7c3aed)    # deep violet
$error           = rgb(f87171)    # soft red
$tertiary        = rgb(c084fc)    # lavender
$surface         = rgb(1e1b2e)    # near-black purple surface
$surface_lowest  = rgb(13111f)    # darkest background

general {
    col.active_border = rgba(a855f7CC)
    col.inactive_border = rgba(1e1b2e88)
}

group {
    col.border_active = rgba(a855f7CC)
    col.border_inactive = rgba(1e1b2e88)
    col.border_locked_active = rgba(f87171CC)
    col.border_locked_inactive = rgba(1e1b2e88)

    groupbar {
        col.active = rgba(a855f7CC)
        col.inactive = rgba(1e1b2e88)
        col.locked_active = rgba(f87171CC)
        col.locked_inactive = rgba(1e1b2e88)
    }
}
