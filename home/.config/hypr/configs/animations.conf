animations {
    enabled = true

    # ── Refined Liquid & Deceleration Bezier Curves (v4 Proven + v5 Polished) ──
    bezier = wind,           0.05, 0.90, 0.10, 1.05   # signature fluid glide with natural momentum
    bezier = winIn,          0.10, 1.05, 0.10, 1.02   # silky smooth window entry deceleration
    bezier = winOut,         0.16, 0.90, 0.20, 1.00   # silky smooth & snappy exit deceleration
    bezier = easeOutQuint,   0.23, 1.00, 0.32, 1.00   # luxury quintic deceleration curve
    bezier = fluent_decel,   0.10, 1.00, 0.00, 1.00   # instant start, velvety soft stop
    bezier = liquid_glide,   0.05, 0.90, 0.10, 1.00   # ultra-smooth linear glide
    bezier = smooth_spring,  0.05, 0.90, 0.10, 1.03   # organic tactile spring for dialogs & popups
    bezier = liquid_fall,    0.08, 0.95, 0.12, 1.01   # workspace swiping momentum
    bezier = md3_accel,      0.30, 0.00, 0.80, 0.15   # snappy acceleration curve

    # ── Window Opening, Closing & Movement (Fluid, Harmonized & Responsive) ──
    animation = windows,       1, 5.2, wind, slide
    animation = windowsIn,     1, 5.0, winIn, slide
    animation = windowsOut,    1, 3.8, winOut, slide
    animation = windowsMove,   1, 4.4, wind, slide

    # ── Layer Transitions (Noctalia v5 Shell, Panels, OSD, Notifications) ──
    animation = layers,        1, 3.2, wind, fade
    animation = layersIn,      1, 3.0, wind, fade
    animation = layersOut,     1, 2.6, winOut, fade

    # ── Workspace Transitions (Vertical glide matching touchpad gestures) ──
    animation = workspaces,          1, 4.5, liquid_fall, slidefadevert 25%
    animation = specialWorkspaceIn,  1, 4.2, winIn, slidefade top 15%
    animation = specialWorkspaceOut, 1, 3.5, winOut, slidefade bottom 15%

    # ── Dedicated Fade & Border Tree ──
    animation = border,        1, 2.5, liquid_glide
    animation = borderangle,   0
    animation = fade,          1, 2.8, liquid_glide
    animation = fadeSwitch,    1, 2.0, liquid_glide
    animation = fadeIn,        1, 2.6, liquid_glide
    animation = fadeOut,       1, 3.2, winOut
    animation = fadeLayersIn,  1, 2.5, liquid_glide
    animation = fadeLayersOut, 1, 2.4, winOut
    animation = fadePopupsIn,  1, 2.2, liquid_glide
    animation = fadePopupsOut, 1, 2.0, winOut
    animation = fadeDim,       1, 2.5, liquid_glide
    animation = fadeShadow,    1, 2.2, liquid_glide
}
