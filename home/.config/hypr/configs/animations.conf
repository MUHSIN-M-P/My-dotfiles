 animations {
    enabled = true

    # ── Organic Liquid Falling & Fullscreen Morph Curves ──
    bezier = liquid_fall, 0.08, 0.95, 0.12, 1.02
    bezier = liquid_fullscreen, 0.1, 1.12, 0.22, 1.0
    bezier = liquid_jelly, 0.05, 0.9, 0.1, 1.08
    bezier = liquid_spring, 0.2, 1.15, 0.25, 1.0
    bezier = liquid_fluid, 0.16, 1.0, 0.3, 1.0
    bezier = liquid_glide, 0.05, 0.9, 0.1, 1.0

    # ── Liquid Window Movement & Ultra-Fluid Fullscreen Morphing ──
    animation = windows, 1, 4.8, liquid_fullscreen
    animation = windowsIn, 1, 4.2, liquid_spring, slide
    animation = windowsOut, 1, 3.8, liquid_glide, slide
    animation = windowsMove, 1, 5.0, liquid_fullscreen, slide

    # ── Smooth Layer Transitions (Shell & Menus) ──
    animation = layers, 1, 3.8, liquid_jelly, fade
    animation = layersIn, 1, 3.8, liquid_spring, popin 90%
    animation = layersOut, 1, 3.0, liquid_glide, popin 90%

    # ── Liquid Falling Vertical Workspace Swiping ──
    animation = workspaces, 1, 5.2, liquid_fall, slidefadevert 35%
    animation = specialWorkspaceIn, 1, 4.5, liquid_spring, slidefade top 15%
    animation = specialWorkspaceOut, 1, 3.8, liquid_glide, slidefade bottom 15%

    # ── Border & Fade Transitions ──
    animation = border, 1, 4.0, liquid_fluid
    animation = borderangle, 1, 10, liquid_fluid, loop
    animation = fade, 1, 3.5, liquid_fluid
    animation = fadeSwitch, 1, 3.5, liquid_fluid
}
