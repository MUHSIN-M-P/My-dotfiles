# regular autostarts — keep this list lean to reduce post-login lag.
# Brave silent-on-ws1 was removed: it pulled ~200 MB and competed for CPU
# right when Hyprland/Noctalia were also initializing. Open Brave on demand
# from the launcher (Super+Z) instead — kernel page-cache pre-warm via
# prewarm-apps.timer keeps its first launch reasonably fast.
# exec-once = [workspace 1 silent] $browser
# Dynamic power profile scaling: boot with throughput-performance, restore user preferred profile after startup
exec-once = ~/.local/bin/restore-power-profile
exec-once = ~/.local/bin/touchpad-gestures-daemon
# Pre-warm runs as a systemd user timer (prewarm-apps.timer): boot + weekly.
bind = $mainMod, A, exec, $ipc overview

# Launcher (Super+Space)
bind = $mainMod, Space, exec, $menu

# Lid switch: close → lock screen immediately (systemd-logind cleanly suspends without DPMS corruption)
bindl = , switch:on:Lid Switch, exec, pidof hyprlock || hyprlock
# Lid switch: open → turn on screen
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on eDP-1



# exec-once = hyprctl setcursor "macOS" 24

env = HYPRCURSOR_THEME=macOS
env = XCURSOR_THEME=macOS
env = HYPRCURSOR_SIZE=24
env = XCURSOR_SIZE=24
env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

input {
    kb_layout = us
    kb_options =
    accel_profile = flat
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.
    natural_scroll = true
    scroll_factor = 0.5
    touchpad {
        natural_scroll = true
        scroll_factor = 0.4
    }
    focus_on_close = 1
}

# ── Liquid Window Resizing Flexibility & Edge Grab ──
general {
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(45483aAA)
}

# ── Visual Tab Groupbar Customization ──
group {
    col.border_active = $primary
    col.border_inactive = $surface
    col.border_locked_active = $error
    col.border_locked_inactive = $surface

    groupbar {
        enabled = true
        font_family = JetBrainsMono NF
        font_size = 11
        font_weight_active = bold
        font_weight_inactive = normal
        col.active = $primary
        col.inactive = $surface_lowest
        col.locked_active = $error
        col.locked_inactive = $surface
        text_color = $surface
        text_color_inactive = $secondary
        round_only_edges = false
        render_titles = true
        height = 18
        rounding = 8
        indicator_height = 3
        indicator_gap = 2
        gaps_in = 4
        gaps_out = 4
        keep_upper_gap = true
    }
}

# ── Liquid Motion & Silky Smooth Transitions (v4 Proven + v5 Polished) ──
animations {
    enabled = true

    # ── Refined Liquid & Deceleration Bezier Curves ──
    bezier = wind,           0.05, 0.90, 0.10, 1.05   # signature fluid glide with natural momentum
    bezier = winIn,          0.10, 1.05, 0.10, 1.02   # silky smooth window entry deceleration
    bezier = winOut,         0.16, 0.90, 0.20, 1.00   # silky smooth & snappy exit deceleration
    bezier = easeOutQuint,   0.23, 1.00, 0.32, 1.00   # luxury quintic deceleration curve
    bezier = fluent_decel,   0.10, 1.00, 0.00, 1.00   # instant start, velvety soft stop
    bezier = liquid_glide,   0.05, 0.90, 0.10, 1.00   # ultra-smooth linear glide
    bezier = smooth_spring,  0.05, 0.90, 0.10, 1.03   # organic tactile spring for dialogs & popups
    bezier = liquid_fall,    0.08, 0.95, 0.12, 1.01   # workspace swiping momentum
    bezier = apple_spring,   0.175, 0.885, 0.32, 1.15 # Apple Liquid Glass spring transition
    bezier = apple_morph,    0.22, 1.00, 0.36, 1.00   # Apple fluid morph expansion
    bezier = md3_accel,      0.30, 0.00, 0.80, 0.15   # snappy acceleration curve

    # ── Window Opening, Closing & Movement (Fluid, Harmonized & Responsive) ──
    animation = windows,       1, 5.2, wind, slide
    animation = windowsIn,     1, 5.0, winIn, slide
    animation = windowsOut,    1, 3.8, winOut, slide
    animation = windowsMove,   1, 4.4, wind, slide

    # ── Layer Transitions (Noctalia v5 Shell, Panels, OSD, Notifications) ──
    animation = layers,        1, 3.2, apple_spring, popin 82%
    animation = layersIn,      1, 3.2, apple_spring, popin 82%
    animation = layersOut,     1, 2.6, winOut, fade

    # ── Workspace Transitions (Vertical glide matching touchpad gestures) ──
    animation = workspaces,          1, 4.5, liquid_fall, slidefadevert 25%
    animation = specialWorkspaceIn,  1, 4.2, winIn, slidefade top 15%
    animation = specialWorkspaceOut, 1, 3.5, winOut, slidefade bottom 15%

    # ── Dedicated Fade & Border Tree ──
    animation = border,        1, 2.5, liquid_glide
    animation = borderangle,   0
    animation = fade,          1, 2.8, liquid_glide
    animation = fadeSwitch,    1, 2.0, liquid_glide
    animation = fadeIn,        1, 2.6, liquid_glide
    animation = fadeOut,       1, 3.2, winOut
    animation = fadeLayersIn,  1, 2.5, liquid_glide
    animation = fadeLayersOut, 1, 2.4, winOut
    animation = fadePopupsIn,  1, 2.2, liquid_glide
    animation = fadePopupsOut, 1, 2.0, winOut
    animation = fadeDim,       1, 2.5, liquid_glide
    animation = fadeShadow,    1, 2.2, liquid_glide
}

misc {
    focus_on_activate = true
    disable_hyprland_guiutils_check = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = true
    vrr = 1
}

decoration {
    rounding = 16
    rounding_power = 6
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
      enabled = true
      range = 14
      render_power = 3
      color = rgba(0000006a)
    }
    blur {
      enabled = true
      size = 9
      passes = 3
      new_optimizations = true
      ignore_opacity = true
      xray = false
      noise = 0.015
      contrast = 0.96
      brightness = 1.08
      vibrancy = 0.38
      vibrancy_darkness = 0.12
      popups = true
    }
}

# Rounded corners for floating windows matching liquid aesthetic
windowrule {
    name = liquidfloating
    rounding = 16
    match:float = 1
}

# ── Tab Switching & Group Management Keybinds ──
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, lockactivegroup, toggle
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod CTRL, H, moveintogroup, l
bind = $mainMod CTRL, L, moveintogroup, r
bind = $mainMod CTRL, K, moveintogroup, u
bind = $mainMod CTRL, J, moveintogroup, d
bind = $mainMod CTRL, Left, moveintogroup, l
bind = $mainMod CTRL, Right, moveintogroup, r
bind = $mainMod CTRL, Up, moveintogroup, u
bind = $mainMod CTRL, Down, moveintogroup, d
bind = $mainMod, D, moveoutofgroup

# ── Window Resizing Flexibility & Positioning ──
# Fast continuous resize (step 70px)
binde = $mainMod ALT, Left, resizeactive, -70 0
binde = $mainMod ALT, Right, resizeactive, 70 0
binde = $mainMod ALT, Up, resizeactive, 0 -70
binde = $mainMod ALT, Down, resizeactive, 0 70
binde = $mainMod ALT, H, resizeactive, -70 0
binde = $mainMod ALT, L, resizeactive, 70 0
binde = $mainMod ALT, K, resizeactive, 0 -70
binde = $mainMod ALT, J, resizeactive, 0 70

# Fine precision resize (step 20px)
binde = $mainMod ALT SHIFT, Left, resizeactive, -20 0
binde = $mainMod ALT SHIFT, Right, resizeactive, 20 0
binde = $mainMod ALT SHIFT, Up, resizeactive, 0 -20
binde = $mainMod ALT SHIFT, Down, resizeactive, 0 20
binde = $mainMod ALT SHIFT, H, resizeactive, -20 0
binde = $mainMod ALT SHIFT, L, resizeactive, 20 0
binde = $mainMod ALT SHIFT, K, resizeactive, 0 -20
binde = $mainMod ALT SHIFT, J, resizeactive, 0 20

# Window position helpers
bind = $mainMod SHIFT, C, centerwindow,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod SHIFT, Space, centerwindow,

# Interactive Resize Submap (Super + Shift + R)
bind = $mainMod SHIFT, R, submap, resize
submap = resize
binde = , right, resizeactive, 30 0
binde = , left, resizeactive, -30 0
binde = , up, resizeactive, 0 -30
binde = , down, resizeactive, 0 30
binde = , l, resizeactive, 30 0
binde = , h, resizeactive, -30 0
binde = , k, resizeactive, 0 -30
binde = , j, resizeactive, 0 30
bind = , escape, submap, reset
bind = , enter, submap, reset
submap = reset

# Show all keybinds
bind = $mainMod, slash, exec, quickshell -c keybinds-viewer
# GPU Status & VRAM Monitor
bind = $mainMod ALT, G, exec, kitty sh -c '~/.local/bin/gpu-status; echo; read -p "Press Enter to exit..."'

# Fan Profile toggle (Fn+F on ASUS Vivobook maps to raw KEY_FN_F code 482/490; Super+F5 as fallback)
bind = , code:482, exec, ~/.local/bin/toggle-fan-profile
bind = , code:490, exec, ~/.local/bin/toggle-fan-profile
bind = $mainMod, F5, exec, ~/.local/bin/toggle-fan-profile
# Direct Fan Speed Override Toggle (Super+Shift+F5 to make fan max ~5000 RPM or return to Auto)
bind = $mainMod SHIFT, F5, exec, asus-fan-control toggle

# ── Native Touchpad Gestures (No External Applications) ───────────────────────
# 3-Finger UP/DOWN → switch workspaces
gesture = 3, vertical, workspace

# 3-Finger LEFT/RIGHT volume is handled continuously by touchpad-gestures-daemon.

# 4-Finger UP → toggle full area view (Super+F view without app fullscreen, hiding top bar while preserving edges)
gesture = 4, up, dispatcher, exec, ~/.local/bin/toggle-fullarea

# 4-Finger DOWN → close active window
gesture = 4, down, close

windowrule {
    name = waydroid-floating
    float = on
    match:class = ^(Waydroid)$
}

windowrule {
    name = gamescope-floating
    float = on
    size = 1280 800
    center = on
    match:class = ^(gamescope)$
}

# ── Top Bar Layer Rules & Liquid Blur ──
layerrule {
    name = waybar-liquid
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.2
    animation = slide top
}

layerrule {
    name = noctalia-topbar
    match:namespace = (noctalia-bar-.*|noctalia-bar-main)
    blur = true
    ignore_alpha = 0.2
    animation = slide top
}

layerrule {
    name = noctalia-bar-exclusion
    match:namespace = noctalia-bar-exclusion-.*
    no_anim = on
}

# ── Floating Panels Layer Rules (Launcher, Clipboard, Control Center, Session) ──
layerrule {
    name = noctalia-panel
    match:namespace = noctalia-panel
    blur = true
    blur_popups = true
    ignore_alpha = 0.05
    animation = popin 82%
}

layerrule {
    name = noctalia-backdrop
    match:namespace = noctalia-backdrop
    blur = true
    ignore_alpha = 0.05
    animation = fade
}

# ── Per-Surface Shell Layer Rules (Smooth & Glitch-Free) ──
layerrule { name = noctalia-notifications  blur = true  ignore_alpha = 0.2  animation = fade   match:namespace = (noctalia-notifications-.*|noctalia-notification.*) }
layerrule { name = noctalia-toast          blur = true  ignore_alpha = 0.2  animation = fade   match:namespace = noctalia-toast-.* }
layerrule { name = noctalia-osd            blur = true  ignore_alpha = 0.2  animation = fade   match:namespace = (noctalia-osd-.*|noctalia-osd) }
layerrule { name = noctalia-battery-warn    no_anim = on      match:namespace = noctalia-battery-warning-.* }
layerrule { name = noctalia-launcher       blur = true  ignore_alpha = 0.05 animation = popin 82% match:namespace = noctalia-launcher-.* }
layerrule { name = noctalia-dock           blur = true  ignore_alpha = 0.2  animation = slide bottom  match:namespace = (noctalia-dock-.*|noctalia-dock) }
layerrule { name = noctalia-dock-peek      no_anim = on      match:namespace = noctalia-dock-peek-.* }
layerrule { name = noctalia-dock-indicator no_anim = on      match:namespace = noctalia-dock-indicator-.* }
layerrule { name = noctalia-bar-trigger    no_anim = on      match:namespace = noctalia-bar-trigger-.* }
layerrule { name = noctalia-popupmenu     animation = fade   match:namespace = noctalia-popupmenu-.* }
layerrule { name = noctalia-startup        no_anim = on      match:namespace = noctalia-startup-overlay }
layerrule { name = screenshot-selection   no_anim = on      match:namespace = .*selection.* }
layerrule { name = screenshot-slurp       no_anim = on      match:namespace = .*slurp.* }
layerrule { name = screenshot-hyprpicker  no_anim = on      match:namespace = .*hyprpicker.* }
layerrule { name = screenshot-quickframe  no_anim = on  animation = none  match:namespace = (hyprquickframe|.*hyprquickframe.*) }

# ── Screenshot Window Rules (No Animations) ──
windowrule {
    name = screenshot-windows-noanim
    no_anim = 1
    match:class = ^(?i)(.*swappy.*|.*flameshot.*|.*ksnip.*|.*hyprshot.*|.*quickshell.*|.*hyprquickframe.*)$
}

# ── Floating Windows & Dialogs Transitions (Smooth Expansion) ──
windowrule {
    name = floating-center-popin
    animation = popin 82%
    match:float = 1
}

windowrule {
    name = dialog-popin
    animation = popin 85%
    match:title = ^(?i)(Save As|Open.*|Select.*|Properties|Export.*|Choose.*|File.*|Folder.*|GIMP Crash.*)$
}

# ── Noctalia v5 Settings Window ──
windowrule {
    name = noctalia-settings
    float = on
    center = on
    size = 980 680
    animation = popin 85%
    match:class = ^(dev\.noctalia\.Noctalia)$
}

windowrule {
    name = bridge-noanim
    no_anim = 1
    match:class = ^(xwaylandvideobridge)$
}
