# regular autostarts — keep this list lean to reduce post-login lag.
# Brave silent-on-ws1 was removed: it pulled ~200 MB and competed for CPU
# right when Hyprland/Noctalia were also initializing. Open Brave on demand
# from the launcher (Super+Z) instead — kernel page-cache pre-warm via
# prewarm-apps.timer keeps its first launch reasonably fast.
# exec-once = [workspace 1 silent] $browser
exec-once = [workspace special silent] $terminal
# Dynamic power profile scaling: boot with throughput-performance, restore user preferred profile after startup
exec-once = ~/.local/bin/restore-power-profile
# Defer non-critical daemons so the bar/wallpaper render first.
exec-once = bash -c 'sleep 4 && easyeffects --gapplication-service'
exec-once = bash -c 'sleep 5 && blueman-applet'
exec-once = bash -c 'sleep 1 && quickshell -c overview'
exec-once = bash -c 'sleep 6 && ~/.local/bin/update-sddm-wallpaper'
exec-once = /home/ldzbeta/.local/bin/hypr-resume-handler.sh
exec-once = /home/ldzbeta/.local/bin/touchpad-gestures-daemon
# Pre-warm runs as a systemd user timer (prewarm-apps.timer): boot + weekly.
bind = $mainMod, A, exec, qs ipc -c overview call overview toggle

# Launcher (Super+Space). Super-tap is not bindable on Wayland Hyprland without keyd.
bind = $mainMod, Space, exec, $menu

# Lid switch: close → lock + turn off screen, open → turn on screen
bindl = , switch:on:Lid Switch, exec, bash -c 'qs -c noctalia-shell ipc call lockScreen lock; sleep 0.6; hyprctl dispatch dpms off eDP-1'
bindl = , switch:off:Lid Switch, exec, bash -c 'for i in 1 2 3 4; do hyprctl dispatch dpms on eDP-1; sleep 0.15; done'


# exec-once = hyprctl setcursor "macOS" 24

env = HYPRCURSOR_THEME=macOS
env = XCURSOR_THEME=macOS
env = HYPRCURSOR_SIZE=24
env = XCURSOR_SIZE=24
env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

input {
    kb_layout = us
    kb_options =
    accel_profile = flat
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification.
    natural_scroll = true
    scroll_factor = 0.5
    touchpad {
        natural_scroll = true
        scroll_factor = 0.4
    }
    focus_on_close = 1
}

# ── Liquid Window Resizing Flexibility & Edge Grab ──
general {
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    gaps_in = 2
    gaps_out = 4
    border_size = 2
}

# ── Visual Tab Groupbar Customization ──
group {
    col.border_active = $primary
    col.border_inactive = $surface
    col.border_locked_active = $error
    col.border_locked_inactive = $surface

    groupbar {
        enabled = true
        font_family = JetBrainsMono NF
        font_size = 11
        font_weight_active = bold
        font_weight_inactive = normal
        col.active = $primary
        col.inactive = $surface_lowest
        col.locked_active = $error
        col.locked_inactive = $surface
        text_color = $surface
        text_color_inactive = $secondary
        round_only_edges = false
        render_titles = true
        height = 18
        rounding = 8
        indicator_height = 3
        indicator_gap = 2
        gaps_in = 4
        gaps_out = 4
        keep_upper_gap = true
    }
}

# ── JaKooLit Side-Slide Window Opening & Closing Transitions ──
animations {
    enabled = true

    # ── Liquid Bezier Curves ──
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.05, 0.95, 0.1, 1.0
    bezier = liquid_pop, 0.05, 0.95, 0.15, 1.02
    bezier = liquid_center, 0.05, 0.9, 0.1, 1.03
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    # ── JaKooLit Side-Slide Window Opening & Closing Transitions ──
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide

    # ── Layer Transitions ──
    animation = layers, 1, 3, wind, fade
    animation = layersIn, 1, 3, wind, fade
    animation = layersOut, 1, 3, winOut, fade

    # ── Workspace Transitions ──
    animation = workspaces, 1, 5.0, wind, slidefadevert 35%
    animation = specialWorkspaceIn, 1, 4.5, winIn, slidefade top 15%
    animation = specialWorkspaceOut, 1, 3.8, winOut, slidefade bottom 15%

    # ── Border & Fade Transitions ──
    animation = border, 1, 2.5, default
    animation = borderangle, 0
    animation = fade, 1, 2.2, default
    animation = fadeSwitch, 1, 1.8, default
}

misc {
    focus_on_activate = true
    disable_hyprland_guiutils_check = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = true
    vrr = 1
}

decoration {
    rounding = 16
    rounding_power = 6
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
      enabled = true
      range = 14
      render_power = 3
      color = rgba(0000006a)
    }
    blur {
      enabled = true
      size = 4
      passes = 1
      new_optimizations = true
      ignore_opacity = true
      xray = true
    }
}

# Rounded corners for floating windows matching liquid aesthetic
windowrule {
    name = liquidfloating
    rounding = 16
    match:float = 1
}

# ── Tab Switching & Group Management Keybinds ──
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, lockactivegroup, toggle
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod CTRL, H, moveintogroup, l
bind = $mainMod CTRL, L, moveintogroup, r
bind = $mainMod CTRL, K, moveintogroup, u
bind = $mainMod CTRL, J, moveintogroup, d
bind = $mainMod CTRL, Left, moveintogroup, l
bind = $mainMod CTRL, Right, moveintogroup, r
bind = $mainMod CTRL, Up, moveintogroup, u
bind = $mainMod CTRL, Down, moveintogroup, d
bind = $mainMod, D, moveoutofgroup

# ── Window Resizing Flexibility & Positioning ──
# Fast continuous resize (step 70px)
binde = $mainMod ALT, Left, resizeactive, -70 0
binde = $mainMod ALT, Right, resizeactive, 70 0
binde = $mainMod ALT, Up, resizeactive, 0 -70
binde = $mainMod ALT, Down, resizeactive, 0 70
binde = $mainMod ALT, H, resizeactive, -70 0
binde = $mainMod ALT, L, resizeactive, 70 0
binde = $mainMod ALT, K, resizeactive, 0 -70
binde = $mainMod ALT, J, resizeactive, 0 70

# Fine precision resize (step 20px)
binde = $mainMod ALT SHIFT, Left, resizeactive, -20 0
binde = $mainMod ALT SHIFT, Right, resizeactive, 20 0
binde = $mainMod ALT SHIFT, Up, resizeactive, 0 -20
binde = $mainMod ALT SHIFT, Down, resizeactive, 0 20
binde = $mainMod ALT SHIFT, H, resizeactive, -20 0
binde = $mainMod ALT SHIFT, L, resizeactive, 20 0
binde = $mainMod ALT SHIFT, K, resizeactive, 0 -20
binde = $mainMod ALT SHIFT, J, resizeactive, 0 20

# Window position helpers
bind = $mainMod SHIFT, C, centerwindow,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod SHIFT, Space, centerwindow,

# Interactive Resize Submap (Super + Shift + R)
bind = $mainMod SHIFT, R, submap, resize
submap = resize
binde = , right, resizeactive, 30 0
binde = , left, resizeactive, -30 0
binde = , up, resizeactive, 0 -30
binde = , down, resizeactive, 0 30
binde = , l, resizeactive, 30 0
binde = , h, resizeactive, -30 0
binde = , k, resizeactive, 0 -30
binde = , j, resizeactive, 0 30
bind = , escape, submap, reset
bind = , enter, submap, reset
submap = reset

# Show all keybinds
bind = $mainMod, slash, exec, quickshell -c keybinds-viewer

# Fan Profile toggle (Fn+F on ASUS Vivobook maps to raw KEY_FN_F code 482/490; Super+F5 as fallback)
bind = , code:482, exec, ~/.local/bin/toggle-fan-profile
bind = , code:490, exec, ~/.local/bin/toggle-fan-profile
bind = $mainMod, F5, exec, ~/.local/bin/toggle-fan-profile
# Direct Fan Speed Override Toggle (Super+Shift+F5 to make fan max ~5000 RPM or return to Auto)
bind = $mainMod SHIFT, F5, exec, asus-fan-control toggle

# ── Touchpad Gestures ───────────────────────────────────────────────────────
# 3-Finger UP/DOWN → switch workspaces
gesture = 3, vertical, workspace

# 3-Finger LEFT/RIGHT → volume adjustment (handled via touchpad-gestures-daemon)
# 4-Finger UP/DOWN → window full space toggle / close (handled via touchpad-gestures-daemon)

windowrule {
    name = waydroid-floating
    float = on
    match:class = ^(Waydroid)$
}

windowrule {
    name = gamescope-floating
    float = on
    size = 1280 800
    center = on
    match:class = ^(gamescope)$
}

# ── Top Bar Layer Rules & Liquid Blur ──
layerrule {
    name = waybar-liquid
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.2
    animation = slide top
}

layerrule {
    name = noctalia-topbar
    match:namespace = noctalia-bar-.*
    blur = true
    ignore_alpha = 0.2
    animation = slide top
}

# ── Per-Surface Shell Layer Rules (Smooth & Glitch-Free) ──
layerrule { name = noctalia-notifications  animation = fade   match:namespace = noctalia-notifications-.* }
layerrule { name = noctalia-toast          animation = fade   match:namespace = noctalia-toast-.* }
layerrule { name = noctalia-osd            animation = fade   match:namespace = noctalia-osd-.* }
layerrule { name = noctalia-battery-warn    no_anim = on      match:namespace = noctalia-battery-warning-.* }
layerrule { name = noctalia-launcher       animation = fade   match:namespace = noctalia-launcher-.* }
layerrule { name = noctalia-dock           animation = slide bottom  match:namespace = noctalia-dock-.* }
layerrule { name = noctalia-dock-peek      no_anim = on      match:namespace = noctalia-dock-peek-.* }
layerrule { name = noctalia-dock-indicator no_anim = on      match:namespace = noctalia-dock-indicator-.* }
layerrule { name = noctalia-bar-trigger    no_anim = on      match:namespace = noctalia-bar-trigger-.* }
layerrule { name = noctalia-popupmenu     animation = fade   match:namespace = noctalia-popupmenu-.* }
layerrule { name = noctalia-startup        no_anim = on      match:namespace = noctalia-startup-overlay }
layerrule { name = screenshot-quickshell  no_anim = on      match:namespace = .*quickshell.* }
layerrule { name = screenshot-quickframe  no_anim = on      match:namespace = .*HyprQuickFrame.* }
layerrule { name = screenshot-selection   no_anim = on      match:namespace = .*selection.* }
layerrule { name = screenshot-slurp       no_anim = on      match:namespace = .*slurp.* }
layerrule { name = screenshot-hyprpicker  no_anim = on      match:namespace = .*hyprpicker.* }
layerrule { name = screenshot-toolkit     no_anim = on      match:namespace = .*screen-toolkit.* }

# ── Screenshot Window Rules (No Animations) ──
windowrule {
    name = screenshot-windows-noanim
    no_anim = 1
    match:class = ^(?i)(.*HyprQuickFrame.*|.*quickshell.*|.*swappy.*|.*flameshot.*|.*ksnip.*|.*hyprshot.*|.*screen-toolkit.*)$
}

# ── Mini Floating Windows & Dialogs Transitions (Liquid Center Expansion) ──
windowrule {
    name = floating-center-popin
    animation = popin 35%
    match:float = 1
}

windowrule {
    name = dialog-popin
    animation = popin 35%
    match:title = ^(?i)(Save As|Open.*|Select.*|Properties|Export.*|Choose.*|File.*|Folder.*|GIMP Crash.*)$
}

windowrule {
    name = bridge-noanim
    no_anim = 1
    match:class = ^(xwaylandvideobridge)$
}


