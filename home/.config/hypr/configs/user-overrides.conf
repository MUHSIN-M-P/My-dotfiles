# regular autostarts — keep this list lean to reduce post-login lag.
# Brave silent-on-ws1 was removed: it pulled ~200 MB and competed for CPU
# right when Hyprland/Noctalia were also initializing. Open Brave on demand
# from the launcher (Super+Z) instead — kernel page-cache pre-warm via
# prewarm-apps.timer keeps its first launch reasonably fast.
# exec-once = [workspace 1 silent] $browser
exec-once = [workspace special silent] $terminal
# Instant background fill — eliminates black flash between SDDM and Hyprland.
# swaybg sets a solid colour immediately (< 50ms), before noctalia-shell renders.
# It exits automatically once wallcards-video sets the real wallpaper.
exec-once = bash -c 'swaybg -m fill -c "#0d0d0f" & SWAYBG_PID=$!; sleep 1 && ~/.local/bin/wallcards-video restore && sleep 0.5 && kill $SWAYBG_PID 2>/dev/null; true'
# Defer non-critical daemons so the bar/wallpaper render first.
exec-once = bash -c 'sleep 5 && easyeffects --gapplication-service'
exec-once = bash -c 'sleep 6 && blueman-applet'
exec-once = bash -c 'sleep 3 && quickshell -c overview'
exec-once = bash -c 'sleep 2 && ~/.local/bin/update-sddm-wallpaper'
# Pre-warm runs as a systemd user timer (prewarm-apps.timer): boot + weekly.
bind = $mainMod, A, exec, qs ipc -c overview call overview toggle

# Launcher (Super+Space). Super-tap is not bindable on Wayland Hyprland without keyd.
bind = $mainMod, Space, exec, $menu

# Lid switch: close → lock + screen off, open → screen on.
bindl = , switch:on:Lid Switch, exec, bash -c 'qs -c noctalia-shell ipc call lockScreen lock; sleep 1; hyprctl dispatch dpms off'
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# exec-once = hyprctl setcursor "macOS" 24

env = HYPRCURSOR_THEME=macOS
env = XCURSOR_THEME=macOS
env = HYPRCURSOR_SIZE=24
env = XCURSOR_SIZE=24
env = WLR_DRM_DEVICES,/dev/dri/card0
input {
    kb_layout = us,tr
    # Caps Lock works normally. Only keep the layout-toggle option.
    # If you ever want Caps→Escape (vim users), use: caps:escape,grp:alt_shift_toggle
    kb_options = grp:alt_shift_toggle
    accel_profile = flat
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0.2 # -1.0 - 1.0, 0 means no modification. }
    # Natural (Mac/Windows-style) scrolling — content moves with finger.
    natural_scroll = true
    # Slow down mouse-wheel scroll across all apps (1.0 = default; 0.5 = half).
    scroll_factor = 0.5
    touchpad {
        natural_scroll = true
        # Touchpad two-finger scroll sensitivity (1.0 default; lower = slower).
        scroll_factor = 0.4
    }
}

animations {
    enabled = true
}

# Faster perceived launch from launcher: focus new windows immediately,
# focus next window cleanly when one closes.
# Also silence the "hyprland-guiutils not installed" startup warning —
# we're using stub binaries to satisfy the runtime calls; this disables
# the cosmetic check.
misc {
    focus_on_activate = true
    disable_hyprland_guiutils_check = true
}
input {
    focus_on_close = 1
}

decoration {
    shadow {
      enabled = true
    }
    blur {
      enabled = true
    }
}

# Remove rounding for floating windows
windowrule {
    name = squarefloating
    rounding = 0
    match:float = 1
}

# Show all keybinds
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/show_binds.sh

# ── Touchpad Gestures (Hyprland 0.51+ syntax) ──────────────────────────────
# 3-Finger UP/DOWN → switch workspaces
gesture = 3, vertical, workspace

# 4-Finger UP   → toggle fullscreen on active window
gesture = 4, up, fullscreen
# 4-Finger DOWN → close active window
gesture = 4, down, close
