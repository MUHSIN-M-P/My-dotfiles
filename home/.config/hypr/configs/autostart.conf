# Disabled swaybg black login splash to allow instant GNOME/KDE style desktop display after login
# exec-once = bash -c 'rm -f /tmp/noctalia-ready; swaybg -m fill -c "#131313" & SWAYBG_PID=$!; timeout 3s bash -c "while [ ! -f /tmp/noctalia-ready ]; do sleep 0.2; done"; kill $SWAYBG_PID 2>/dev/null'

# Update D-Bus and systemd user activation environments immediately for instant portal startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = ~/.local/bin/unlock-keyring.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = bash -c 'export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"; ulimit -S -n 1024; ulimit -H -n 524288; unset GBM_BACKEND; exec qs -c noctalia-shell'
