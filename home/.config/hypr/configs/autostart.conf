# Defer D-Bus env update by 1s so xdg-desktop-portal doesn't block the first frame
exec-once = bash -c 'sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# wl-clip-persist not packaged for Fedora 43; skip (or cargo install wl-clip-persist)
# exec-once = wl-clip-persist --clipboard regular
# Start noctalia-shell with a higher file-descriptor limit so apps spawned
# from the launcher inherit it (browsers/Electron/Java need many FDs).
exec-once = bash -c 'export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"; ulimit -S -n 1024; ulimit -H -n 524288; exec qs -c noctalia-shell'
