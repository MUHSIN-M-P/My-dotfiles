# swaybg login-splash bridge: starts FIRST, paints #131313 immediately on
# Hyprland frame 1, covering the SDDM→desktop gap. Exits when quickshell
# signals /tmp/noctalia-ready (written once WallpaperService is initialized).
exec-once = bash -c 'rm -f /tmp/noctalia-ready; swaybg -m fill -c "#131313" & SWAYBG_PID=$!; while [ ! -f /tmp/noctalia-ready ]; do sleep 0.2; done; kill $SWAYBG_PID 2>/dev/null'

# Update D-Bus and systemd user activation environments immediately for instant portal startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = ~/.local/bin/unlock-keyring.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = bash -c 'export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"; ulimit -S -n 1024; ulimit -H -n 524288; exec qs -c noctalia-shell'
