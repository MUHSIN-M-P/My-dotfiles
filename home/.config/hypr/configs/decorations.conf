#####################
### LOOK AND FEEL ###
#####################
$gapsout = 4

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = $gapsout

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $primary
    col.inactive_border = $surface

}

group {
    col.border_active = $primary
    col.border_inactive = $surface
    col.border_locked_active = $error
    col.border_locked_inactive = $surface

    groupbar {
        enabled = true
        font_family = JetBrainsMono NF
        font_size = 11
        font_weight_active = bold
        font_weight_inactive = normal
        col.active = $primary
        col.inactive = $surface_lowest
        col.locked_active = $error
        col.locked_inactive = $surface
        text_color = $surface
        text_color_inactive = $secondary
        round_only_edges = false
        render_titles = true
        height = 18
        rounding = 8
        indicator_height = 3
        indicator_gap = 2
        gaps_in = 4
        gaps_out = 4
        keep_upper_gap = true
    }
}

decoration {
    rounding = 18
    rounding_power = 5
    active_opacity   = 0.97
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    shadow {
      enabled      = true
      range        = 30
      render_power = 4
      color        = rgba(0d0b14cc)
      color_inactive = rgba(0d0b1499)
    }

    blur {
        enabled          = true
        size             = 8
        passes           = 3
        brightness       = 0.75
        contrast         = 0.9
        noise            = 0.02
        new_optimizations = on
        ignore_opacity   = true
        xray             = true
        popups           = true
        popups_ignorealpha = 0.2
    }
}

# huge gap when there is only window in workspace
# workspace = w[tv1]s[false], gapsout:12, gapsin:0
# workspace = f[1]s[false], gapsout:$gapsout, gapsin:0
